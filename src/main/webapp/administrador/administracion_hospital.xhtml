<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui">

<ui:composition template="../WEB-INF/plantilla.xhtml">
    <ui:define name="titulo">Buscar y gestionar hospitales</ui:define>
    <ui:define name="contenido">
        <div class="container my-4">
            <h2 class="text-center mb-4">Buscar y gestionar hospitales</h2>
            <h3>Hospitales</h3>

            <h:form id="formBuscarHospital">
                <div class="mb-3">
                    <h:panelGroup>
                        <h:outputLabel for="hospital" styleClass="form-label"/>
                        <strong>Buscar por hospital:</strong>
                    </h:panelGroup>
                    <h:inputText id="hospital" class="form-control" placeholder="Buscar hospital..."
                                 value="#{ControladorHospitales.hospitalBuscar}" />
                </div>

                <h:messages id="mensajesError" globalOnly="true" style="list-style-type: none;" styleClass="alert alert-danger"/>

                <div class="text-center" style="margin-bottom: 20px;">
                    <h:commandButton value="Buscar" action="#{ControladorHospitales.buscarHospitalesAJAX()}" class="btn btn-primary">
                        <f:ajax execute="@form" render="listaHospitales mensajesError" />
                    </h:commandButton>
                </div>
            </h:form>

            <h:panelGroup id="listaHospitales" style="flex: 1; margin-bottom: 20px;">
                <ui:repeat value="#{ControladorHospitales.listaHospitales}" var="hospital">
                    <div class="doctor-card bg-white d-flex justify-content-between align-items-center p-4 rounded shadow mb-4">
                        <div class="d-flex align-items-center">
                            <div class="doctor-info">
                                <p class="mb-1"><strong>Nombre: </strong> #{hospital.nombre}</p>
                            </div>
                        </div>
                        <div class="text-center">
                            <p class="mb-1"><strong>Dirección: </strong> #{hospital.direccion}</p>
                        </div>
                        <div style="display: flex; flex-direction: column; gap: 5px; align-items: center;">
                            <h:link outcome="/administrador/editar_hospital.xhtml"
                                    styleClass="btn btn-primary"
                                    style="white-space: nowrap; width: 100%;">
                                <f:param name="hospitalNombre" value="#{hospital.nombre}" />
                                <i class="pi pi-pencil"></i> Editar
                            </h:link>
                            <p:commandButton value="Eliminar"
                                             actionListener="#{ControladorHospitales.eliminarHospital(hospital)}"
                                             update="listaHospitales mensajesError"
                                             class="btn btn-danger w-100"
                                             icon="pi pi-trash"
                                             process="@this"
                                             onclick="return confirm('¿Estás seguro de que deseas eliminar este hospital?');"/>
                        </div>
                    </div>
                </ui:repeat>
            </h:panelGroup>

            <div class="text-center mb-4">
                <h:button value="Crear Hospital"
                          outcome="/administrador/anadir_hospital.xhtml"
                          styleClass="btn btn-success" />
            </div>
        </div>
    </ui:define>
</ui:composition>
</html>
