<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:pt="jakarta.faces.passthrough">
<h:head>
    <meta charset="UTF-8"/>
    <title>Editar Cita Médica</title>
</h:head>

<h:body>
    <ui:include src="../WEB-INF/recursos_bootstrap.xhtml"/>
    <ui:include src="../WEB-INF/cabecera.xhtml" />

    <div class="container my-4">
        <h2 class="text-center mb-4">Editar Cita Médica</h2>

        <h:form>
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="usuario">Paciente:</label>
                        <h:inputText id="usuario" value="#{CitaSession.citaSeleccionada.paciente.nombre}" disabled="true" styleClass="form-control" />
                        <h:message for="usuario" styleClass="text-danger" />
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="form-group">
                        <label for="fechaCita">Fecha de la cita:</label>
                        <h:inputText id="fechaCita" value="#{CitaSession.citaSeleccionada.fecha}" pt:type="date"
                                     styleClass="form-control"
                                     required="true"
                                     requiredMessage="La fecha es obligatoria">
                            <f:convertDateTime type="localDate" pattern="yyyy-MM-dd"/>
                        </h:inputText>
                        <h:message for="fechaCita" styleClass="text-danger"/>
                    </div>
                </div>
            </div>

            <div class="row mt-4">
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="mensaje">Mensaje o Nota al usuario:</label>
                        <h:inputTextarea id="mensaje" value="#{CitaSession.citaSeleccionada.mensajeDelMedico}" rows="4" styleClass="form-control"/>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="form-group">
                        <label for="estado">Estado de la cita:</label>
                        <h:selectOneMenu id="estado" value="#{CitaSession.citaSeleccionada.estado}" styleClass="form-control">
                            <f:selectItem itemLabel="Seleccione un estado" itemValue="" />
                            <f:selectItem itemLabel="Confirmada" itemValue="CONFIRMADA" />
                            <f:selectItem itemLabel="Pendiente" itemValue="PENDIENTE" />
                        </h:selectOneMenu>
                        <h:message for="estado" styleClass="text-danger" />
                    </div>
                </div>
            </div>

            <div class="row mt-4">
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="precio">Precio:</label>
                        <h:inputText id="precio" value="#{CitaSession.citaSeleccionada.precio}" styleClass="form-control"/>
                        <h:message for="precio" styleClass="text-danger" />
                    </div>
                </div>
            </div>

            <div class="text-center mt-4">
                <h:commandButton value="Guardar cambios" action="#{ControladorCitas.guardarCambios}" styleClass="btn btn-success"/>
            </div>
        </h:form>
    </div>

</h:body>
</html>
