<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:pt="jakarta.faces.passthrough">
<h:head>
   <meta charset="UTF-8"/>
   <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
   <title>Registro de usuario</title>
</h:head>

<h:body>
   <ui:include src="WEB-INF/recursos_bootstrap.xhtml"/>

   <header class="bg-secondary text-light p-3 d-flex justify-content-between align-items-center">
      <div class="logo-container text-center">
         <h:link outcome="pantalla_inicio">
            <h:graphicImage library="imagenes" name="logo-UJASalud-negro.png" style="width: 60px;" class="img-fluid"/>
         </h:link>
         <h1 class="h5">UJASalud</h1>
      </div>
      <h:link value="Volver" outcome="index" styleClass="btn btn-info"/>
   </header>
   <div class="container my-4">
      <h2 class="text-center mb-4">Introduce tus datos personales</h2>

      <h:form class="row">
         <div class="col-12 mb-3">
            <h:outputLabel for="nombre" value="Nombre:" styleClass="form-label"/>
            <h:inputText id="nombre" value="#{ControladorUsuarios.usuarioNuevo.nombre}"
                         styleClass="form-control"
                         required="true"
                         requiredMessage="El nombre es obligatorio">
               <f:passThroughAttribute name="placeholder" value=""/>
            </h:inputText>
            <h:message for="nombre" styleClass="text-danger"/>
         </div>

         <div class="col-12 mb-3">
            <h:outputLabel for="usuario" value="Usuario:" styleClass="form-label"/>
            <h:inputText id="usuario" value="#{ControladorUsuarios.usuarioNuevo.usuario}"
                         styleClass="form-control"
                         required="true"
                         requiredMessage="El usuario es obligatorio."
                         placeholder="Usuario">
            </h:inputText>
            <h:message for="usuario" styleClass="text-danger"/>
         </div>

         <div class="col-12 mb-3">
            <h:outputLabel for="email" value="Email:" styleClass="form-label"/>
            <h:inputText id="email" value="#{ControladorUsuarios.usuarioNuevo.email}"
                         styleClass="form-control"
                         required="true"
                         requiredMessage="El correo es obligatorio"
                         placeholder="Email (correo@ejemplo.com)">
            </h:inputText>
            <h:message for="email" styleClass="text-danger"/>
         </div>

         <div class="col-12 mb-3">
            <h:outputLabel for="password" value="Contraseña:" styleClass="form-label"/>
            <h:inputSecret id="password" value="#{ControladorUsuarios.usuarioNuevo.contrasena}"
                           styleClass="form-control"
                           required="true"
                           requiredMessage="La contraseña es obligatoria"
                           placeholder="Contraseña"/>
            <h:message for="password" styleClass="text-danger"/>
         </div>

         <div class="col-12 mb-3">
            <h:outputLabel for="dni" value="DNI:" styleClass="form-label"/>
            <h:inputText id="dni" value="#{ControladorUsuarios.usuarioNuevo.dni}"
                         styleClass="form-control"
                         required="true"
                         requiredMessage="El DNI es obligatorio"
                         placeholder="DNI (12345678A)">
            </h:inputText>
            <h:message for="dni" styleClass="text-danger"/>
         </div>

         <div class="col-12 mb-3">
            <h:outputLabel for="fechaNacimiento" value="Fecha de Nacimiento:" styleClass="form-label"/>
            <h:inputText id="fechaNacimiento" value="#{ControladorUsuarios.usuarioNuevo.fechaNacimiento}" pt:type="date"
                         styleClass="form-control"
                         required="true"
                         requiredMessage="La fecha de nacimiento es obligatoria">
               <f:convertDateTime type="localDate" pattern="yyyy-MM-dd"/>
            </h:inputText>
            <h:message for="fechaNacimiento" styleClass="text-danger"/>
         </div>

         <div class="col-12 mb-3">
            <h:outputLabel for="tarjeta" value="Número de tarjeta UJASalud:" styleClass="form-label"/>
            <h:inputText id="tarjeta" value="#{ControladorUsuarios.usuarioNuevo.numeroDeTarjeta}"
                         styleClass="form-control"
                         required="true"
                         requiredMessage="El número de tarjeta es obligatorio"
                         placeholder="Número de tarjeta UJASalud (AB0123456789)">
            </h:inputText>
            <h:message for="tarjeta" styleClass="text-danger"/>
         </div>

         <div class="col-12 mb-3">
            <h:outputLabel for="telefono" value="Teléfono:" styleClass="form-label"/>
            <h:inputText id="telefono" value="#{ControladorUsuarios.usuarioNuevo.telefono}"
                         styleClass="form-control"
                         required="true"
                         requiredMessage="El teléfono es obligatorio"
                         placeholder="Teléfono (600123456)">
            </h:inputText>
            <h:message for="telefono" styleClass="text-danger"/>
         </div>

         <div class="col-12 mb-3">
            <h:outputLabel for="direccion" value="Dirección:" styleClass="form-label"/>
            <h:inputTextarea id="direccion" value="#{ControladorUsuarios.usuarioNuevo.direccion}"
                             styleClass="form-control"
                             required="true"
                             requiredMessage="La dirección es obligatoria"
                             placeholder="Dirección completa"
                             rows="3"/>
            <h:message for="direccion" styleClass="text-danger"/>
         </div>

         <div class="col-12 text-center">
            <h:commandButton value="Registrarme" action="#{ControladorUsuarios.registroUsuario}"
                             styleClass="btn btn-info w-50"/>
         </div>
      </h:form>
   </div>
</h:body>
</html>
