<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns:h="jakarta.faces.html">
<h:body>
   <header class="bg-secondary text-light p-3 d-flex justify-content-between align-items-center">
      <div class="logo-container text-center">
         <h:link outcome="/pantalla_inicio">
            <h:graphicImage library="imagenes" name="logo-UJASalud-negro.png" style="width: 60px;" class="img-fluid"/>
         </h:link>
         <h1 class="h5">UJASalud</h1>
      </div>
      <nav>
         <h:link outcome="/pantalla_inicio" styleClass="btn btn-link text-light">Inicio</h:link>
         <h:panelGroup rendered="#{request.isUserInRole('ADMINISTRADORES')}">
            <h:link outcome="/administrador/administracion_usuario" styleClass="btn btn-link text-light">Administrar usuarios</h:link>
            <h:link outcome="/administrador/administracion_hospital" styleClass="btn btn-link text-light">Administrar hospitales</h:link>
         </h:panelGroup>
         <h:panelGroup rendered="#{request.isUserInRole('USUARIOS')}">
            <h:link outcome="/pantalla_busqueda" styleClass="btn btn-link text-light">Reserva cita médica</h:link>
         </h:panelGroup>
         <h:panelGroup rendered="#{request.isUserInRole('MEDICOS')}">
            <h:link outcome="/medico/calendario" styleClass="btn btn-link text-light">Gestión citas médicas</h:link>
         </h:panelGroup>
      </nav>

      <h:panelGroup rendered="#{not empty request.remoteUser}">
         <h:form>
            <h:commandButton value="Cerrar Sesión" action="#{ControladorUsuarios.logout}" styleClass="btn btn-info"/>
         </h:form>
      </h:panelGroup>
   </header>
</h:body>
</html>
